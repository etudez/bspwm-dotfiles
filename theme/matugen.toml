# Generated by matugen from the current wallpaper.
# Do not edit: run `theme <image>` instead.

[templates.bspwm]
input_path = "./bspwm-colors.sh.tmpl"
output_path = "~/.config/bspwm/colors.sh"

[templates.picom]
input_path = "./picom.conf.tmpl"
output_path = "~/.config/picom/picom.conf"

[templates.kitty]
input_path = "./kitty-colors.conf.tmpl"
output_path = "~/.config/kitty/colors.conf"

[templates.rofi]
input_path = "./rofi-colors.rasi.tmpl"
output_path = "~/.config/rofi/colors.rasi"

[templates.dunst]
input_path = "./dunstrc.tmpl"
output_path = "~/.config/dunst/dunstrc"

[templates.gtk]
input_path = "./gtk-colors.css.tmpl"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path = "./gtk-colors.css.tmpl"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.polybar]
input_path = "./polybar-colors.ini.tmpl"
output_path = "~/.config/polybar/colors.ini"

[templates.tide]
input_path = "./tide-colors.fish.tmpl"
output_path = "~/.config/fish/conf.d/tide-colors.fish"

[templates.xresources]
input_path = "./xresources.tmpl"
output_path = "~/.config/X11/xresources"

[config]
version_check = false
caching = false
prefer = "saturation"
fallback_color = "#808080"
contrast = 0.0
