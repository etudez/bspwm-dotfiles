; Top bar — Material You, square, minimal.
; Colours are generated into colors.ini by `theme`.

include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/top]
monitor = ${env:MONITOR:}
width = 50%
height = 26
offset-x = 25%
offset-y = 4
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 2
border-color = ${colors.primary}

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrains Mono:size=9;2"
font-1 = "Symbols Nerd Font:size=10;2"

modules-left = bspwm xkeyboard
modules-center = date
modules-right = systray pulseaudio cpu gpu network power

override-redirect = true
wm-restack = bspwm
enable-ipc = true
dpi = 96
