[module/bspwm]
type = internal/bspwm
enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.on-primary}
label-focused-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.on-surface-variant}
label-occupied-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.outline}
label-empty-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.error}
label-urgent-foreground = ${colors.on-error}
label-urgent-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
label-layout = %layout%
label-layout-foreground = ${colors.on-surface-variant}
format = <label-layout>

[module/date]
type = internal/date
interval = 1
date = %H:%M
format = <label>
label = %date%
label-foreground = ${colors.on-surface}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = %{T2}%{T-} <label-volume>
label-volume = %percentage%%
format-muted = %{T2}%{T-} <label-muted>
label-muted = muted
label-muted-foreground = ${colors.outline}
click-left = ~/.local/bin/sound
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/cpu]
type = custom/script
exec = ~/.local/bin/bar-temp cpu
interval = 5
format = %{T2}%{T-} <label>
label = %output%
label-foreground = ${colors.on-surface-variant}

[module/gpu]
type = custom/script
exec = ~/.local/bin/bar-temp gpu
interval = 5
format = %{T2}󰢮%{T-} <label>
label = %output%
label-foreground = ${colors.on-surface-variant}

[module/network]
type = custom/script
exec = ~/.local/bin/bar-net
interval = 5
format = %{T2}%{T-} <label>
label = %output%
label-foreground = ${colors.on-surface-variant}

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 6pt

[module/power]
type = custom/text
content = %{T2}%{T-}
content-foreground = ${colors.on-surface-variant}
click-left = ~/.local/bin/powermenu
